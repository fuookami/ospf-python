site_name: ospf-python
site_description: Python implementation of ospf-kotlin optimization framework
site_url: https://github.com/fuookami/ospf-python
repo_url: https://github.com/fuookami/ospf-python
repo_name: fuookami/ospf-python

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            docstring_section_style: spacy
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            line_length: 80

nav:
  - Home: index.md
  - API Reference:
      - utils: api/utils.md
      - core: api/core.md
      - math: api/math.md
      - quantities: api/quantities.md
      - framework: api/framework.md
  - Guide:
      - Quick Start: guide/quickstart.md
      - Architecture: guide/architecture.md
      - Extension Points: guide/extension-points.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
