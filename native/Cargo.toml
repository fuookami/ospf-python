[package]
name = "ospf-python-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Private PyO3 boundary for the OSPF Python interface"
repository = "https://github.com/fuookami/ospf-python"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["num-bigint"] }
ospf-rust-base = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-core = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de", features = ["serde"] }
ospf-rust-framework = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-framework-bpp = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-framework-bpp1d = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-framework-gantt-scheduling = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-math = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-multiarray = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
ospf-rust-core-plugin-gurobi = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de", optional = true }
ospf-rust-core-plugin-scip = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de", optional = true }
ospf-rust-quantities = { git = "https://github.com/fuookami/ospf-rust.git", rev = "74e8b38ba283d1cf97fb7647559d9ddf579fc7de" }
bigdecimal = "=0.4.11"
num-bigint = "=0.4.8"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
numpy = "=0.30.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "1.0"
time = "=0.3.55"

[features]
default = []
scip = ["dep:ospf-rust-core-plugin-scip", "ospf-rust-core-plugin-scip/scip"]
gurobi10 = ["dep:ospf-rust-core-plugin-gurobi", "ospf-rust-core-plugin-gurobi/gurobi10"]
gurobi11 = ["dep:ospf-rust-core-plugin-gurobi", "ospf-rust-core-plugin-gurobi/gurobi11"]
gurobi12 = ["dep:ospf-rust-core-plugin-gurobi", "ospf-rust-core-plugin-gurobi/gurobi12"]

[workspace]
