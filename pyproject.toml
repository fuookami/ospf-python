[project]
name = "ospf-python"
version = "0.1.0"
description = "Python implementation of ospf-kotlin optimization framework"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "fuookami" },
]
keywords = [
    "optimization",
    "linear-programming",
    "mixed-integer-programming",
    "column-generation",
    "bin-packing",
    "cutting-stock",
    "scheduling",
    "gantt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
]

dependencies = [
    "gurobipy>=13.0.2",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyscipopt>=6.2.1",
    "returns>=0.22",
]

[project.urls]
Homepage = "https://github.com/fuookami/ospf-python"
Repository = "https://github.com/fuookami/ospf-python"
Issues = "https://github.com/fuookami/ospf-python/issues"

[project.optional-dependencies]
gurobi = ["gurobipy>=11.0"]
scip = ["pyscipopt>=4.0"]
copt = ["coptpy>=6.0"]
mindopt = ["mindoptpy>=0.4"]
all-solvers = [
    "gurobipy>=11.0",
    "pyscipopt>=4.0",
    "coptpy>=6.0",
    "mindoptpy>=0.4",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ospf_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "benchmark: performance benchmark tests (deselect with '-m \"not benchmark\"')",
    "migration_consistency: tests verifying Kotlin/Rust alignment",
]

[tool.mypy]
python_version = "3.13"
strict = true
namespace_packages = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "pydantic.*",
    "returns.*",
    "gurobipy.*",
    "pyscipopt.*",
    "coptpy.*",
    "mindoptpy.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "ospf_python.core.solver.copt.*",
    "ospf_python.core.solver.mindopt.*",
    "ospf_python.framework.csp1d.*",
    "ospf_python.framework.gantt_scheduling.*",
    "ospf_python.framework.bpp1d.*",
    "ospf_python.framework.bpp2d.*",
    "ospf_python.framework.csp2d.*",
    "ospf_python.framework.network_scheduling.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tests.core.solver.test_cross_solver_consistency.*",
    "tests.core.solver.test_gurobi.*",
    "tests.core.solver.test_scip.*",
    "tests.core.solver.test_copt.*",
    "tests.core.solver.test_mindopt.*",
]

# CI Hard Gates - 硬门禁配置
# Production code must not contain:
# - TODO (use issue tracker instead)
# - NotImplementedError (implement or exclude)
# - stub/placeholder (implement or mark as excluded in migration-matrix.md)
# - Empty constraint returns without justification
ignore_errors = true

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # type-checking imports
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment (common in tests)
    "E741",  # ambiguous variable name (l, I used in math)
    "N818",  # exception naming (Err/Failed/Fatal are intentional names)
    "UP046", # Generic subclass (needed for Python 3.12 compatibility)
    "UP047", # type parameters (needed for Python 3.12 compatibility)
    "UP035", # deprecated imports (typing still works)
    "UP007", # Union syntax (Union is clearer for type aliases)
    "TC002", # third-party imports (numpy.typing needed at runtime)
    "TC003", # type-checking imports (move to TYPE_CHECKING block)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # importorskip requires import after pytest

[tool.ruff.lint.isort]
known-first-party = ["ospf_python"]

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
]
